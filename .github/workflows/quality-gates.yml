# Quality Gates for batch-live-reconciliation-service
#
# This workflow runs the EXACT same checks as:
#   - Local: ./scripts/quality-gates.sh
#   - Cloud Build: cloudbuild.yaml
#
# All three MUST be kept in sync. If you change one, change all three.
#
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Checkout dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          if [ -n "$GH_PAT" ]; then
            # Clone api-contracts to ../ (matches pyproject.toml path source)
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/api-contracts.git" ../api-contracts 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/api-contracts.git" ../api-contracts 2>/dev/null) || true
            echo "✅ Cloned api-contracts"

            # Clone unified-trading-library to ../ (matches uv.lock path source)
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-library.git" ../unified-trading-library 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-library.git" ../unified-trading-library 2>/dev/null) || true
            echo "✅ Cloned unified-trading-library"

            # Clone unified-events-interface to ../ (matches pyproject.toml path source)
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-events-interface.git" ../unified-events-interface 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-events-interface.git" ../unified-events-interface 2>/dev/null) || true
            echo "✅ Cloned unified-events-interface"

            # Clone unified-config-interface to ../ (matches pyproject.toml dependency)
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-config-interface.git" ../unified-config-interface 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-config-interface.git" ../unified-config-interface 2>/dev/null) || true
            echo "✅ Cloned unified-config-interface"
          else
            echo "❌ GH_PAT not set" && exit 1
          fi

      - name: Install ripgrep (required for codex checks)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          uv pip install --python .venv/bin/python -e ../api-contracts 2>/dev/null || true
          uv pip install --python .venv/bin/python -e ../unified-trading-library
          uv pip install --python .venv/bin/python -e ../unified-events-interface
          uv pip install --python .venv/bin/python -e ../unified-config-interface
          uv pip install --python .venv/bin/python -e . --no-deps
          uv pip install --python .venv/bin/python pydantic pydantic-settings pandas numpy python-dateutil \
            python-dotenv requests
          uv pip install --python .venv/bin/python pytest pytest-cov pytest-asyncio pytest-mock pytest-timeout pytest-xdist ruff==0.15.0 basedpyright>=1.21.0 pip-audit>=2.7.0

      - name: Add venv to PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: Run quality gates
        env:
          CLOUD_MOCK_MODE: "true"
          GCP_PROJECT_ID: "test-project"
        run: bash scripts/quality-gates.sh

      - name: Quality gates passed
        run: |
          echo ""
          echo "======================================================================"
          echo "✅ ALL QUALITY GATES PASSED"
          echo "======================================================================"
