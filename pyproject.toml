[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batch-live-reconciliation-service"
version = "0.1.0"
description = "T+1 nightly batch-live reconciliation orchestrator"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic<3.0.0,>=2.12.5",
    "unified-trading-library>=0.1.0,<1.0.0",
    "unified-internal-contracts>=0.1.0,<1.0.0",
    "pytest<10.0.0,>=9.0.1",
    "pytest-cov<8.0.0,>=7.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-timeout<3.0.0,>=2.4.0",
    "pytest-xdist<4.0.0,>=3.6.0",
    "basedpyright==1.38.2",
]

[project.scripts]
batch-live-reconciliation-service = "batch_live_reconciliation_service.cli.main:main"


[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.unified-internal-contracts]
path = "../unified-internal-contracts"
editable = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportAny = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
