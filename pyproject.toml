[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batch-live-reconciliation-service"
version = "0.1.0"
description = "T+1 nightly batch-live reconciliation orchestrator"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "unified-config-interface",
    "unified-cloud-interface",
    "unified-events-interface",
    "unified-trading-library",
]

[project.scripts]
batch-live-reconciliation-service = "batch_live_reconciliation_service.cli.main:main"


[tool.uv.sources.unified-config-interface]
path = "../unified-config-interface"
editable = true

[tool.uv.sources.unified-cloud-interface]
path = "../unified-cloud-interface"
editable = true

[tool.uv.sources.unified-events-interface]
path = "../unified-events-interface"
editable = true

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportAny = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
